[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skypoints-etl"
version = "0.1.0"
description = "SkyPoints loyalty programme ingestion: flat-file member profiles + JSON redemption feed -> per-country target tables"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7.4", "openpyxl>=3.1"]

[project.scripts]
skypoints = "skypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
