name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor in pyproject; 3.13 is what it is developed
        # against. Testing both ends catches a feature that quietly raises the
        # real minimum above what the packaging metadata promises.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      # Proves the documented entry point still works from a clean checkout.
      # A test suite can pass while the packaged console script is broken, and
      # that is the first thing anyone reading the README will run.
      - name: Smoke test the CLI
        run: |
          skypoints run \
            --members data/sample/SKYPOINTS_MEMBERS_20240115_10300000.dat \
            --redemptions data/sample/SKYPOINTS_REDEMPTIONS_20240115_10300000.json \
            --as-of 2024-01-15 \
            --out out
          test -f out/targets/table_india.csv
          test -f out/targets/redemption_txn.csv
          test -f out/run_report.json

      # Exercises the supplied country feeds, including the .xlsx path, which
      # depends on openpyxl and so can break independently of everything else.
      - name: Smoke test ingestion of the supplied country feeds
        run: |
          skypoints ingest --dir data/incoming --as-of 2022-12-31 --out out-real
          test -f out-real/targets/table_usa.csv
          test -f out-real/targets/table_india.csv
          test -f out-real/targets/table_australia.csv
          test -f out-real/quarantine.csv
